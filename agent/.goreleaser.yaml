# Release of the agent: binaries, checksums, winget and Homebrew manifests.
# macOS builds need CGO for the tray icon, so they run on a macOS runner
# (release workflow, job "darwin"); this file builds the rest.
version: 2
project_name: modfield-agent

before:
  hooks:
    - sh -c "../scripts/embed-ui.sh"

builds:
  - id: agent
    main: ./cmd/modfield-agent
    binary: modfield-agent
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
      # Keep the public key embedded in source unless a secret overrides it (rotation).
      - -X modfield.dev/agent/internal/update.Keyring={{ envOrDefault "MODFIELD_UPDATE_KEYRING" "k2:S3ZC_kHhYgPO03K3qHhZc5FHx-gOs5pqwM77ZKL5Ozo" }}
      # Windows: tray app without a console window.
      - '{{ if eq .Os "windows" }}-H windowsgui{{ end }}'
    flags: [-trimpath]

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  # minisign over checksums.txt (Linux install.sh verifies it).
  - id: minisign
    cmd: minisign
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"
    args: ["-S", "-s", "{{ .Env.MINISIGN_KEY_FILE }}", "-m", "${artifact}", "-x", "${signature}"]
    signature: "${artifact}.minisig"
    artifacts: checksum

winget:
  - name: ModField Agent
    publisher: ModField
    short_description: Agente local do ModField (Modbus RTU/TCP para o navegador)
    license: MIT
    # Per-user scope: no administrator.
    package_identifier: ModField.Agent
    repository:
      owner: modfield
      name: winget-pkgs
      branch: "modfield-agent-{{.Version}}"

release:
  draft: true
  # Served through modfield.app/downloads/* (vercel.json redirects to the latest
  # release). install.sh fetches the Linux binary, checksums and this unit from here.
  extra_files:
    - glob: ./installer/linux/install.sh
    - glob: ./installer/linux/modfield-agent.service
  # TODO: also upload manifest.json (Home download list) and the signed
  # update.json (cmd/gen-manifest) once a job gathers all six platform binaries
  # — the darwin build comes from the separate macOS runner.
