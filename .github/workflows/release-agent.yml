name: Release agent

on:
  push:
    tags: ["v*"]

# goreleaser creates the release and gh uploads the extra manifests to it.
permissions:
  contents: write

# Releases are signed with minisign over checksums.txt (free) and carry the
# ed25519-signed auto-update manifest. OS code signing (Windows Authenticode,
# Apple Developer ID) is intentionally not done — it needs paid certificates —
# so those steps stay gated on secrets and are skipped; the binaries ship
# unsigned and are verified by SHA-256 + minisign (see docs/install-agent).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: sudo apt-get install -y minisign
      # minisign -s takes a file path, so materialise the secret key into one.
      - name: Write minisign key
        run: |
          printf '%s' "${{ secrets.MINISIGN_SECRET_KEY }}" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: agent
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODFIELD_UPDATE_KEYRING: ${{ secrets.MODFIELD_UPDATE_KEYRING }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      # goreleaser uploads the four linux/windows binaries, checksums, install.sh
      # and the unit file to the (draft) release itself; the manifest job reads
      # them back from there, so nothing more to hand off here.

  windows-installer:
    needs: build
    runs-on: windows-latest
    # The secrets context is not allowed in a step `if:`, so surface the presence
    # of the (optional, paid) signing cert as an env the condition can read.
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
    strategy:
      matrix: { arch: [x64, arm64] }
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile && pnpm build && sh scripts/embed-ui.sh
        shell: bash
      - run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME#v}" -o modfield-agent.exe ./cmd/modfield-agent
        working-directory: agent
        shell: bash
        env: { GOARCH: "${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}" }
      - name: Installer version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Sign executable (Authenticode)
        if: ${{ env.HAS_WIN_CERT == 'true' }}
        run: echo "sign agent/modfield-agent.exe with the chosen provider"
      - run: iscc /DVersion=${{ env.VERSION }} /DArch=${{ matrix.arch }} /DBinary=..\..\modfield-agent.exe agent\installer\windows\modfield-agent.iss
      - name: Upload the installer to the release
        shell: bash
        run: |
          f=$(find agent/installer/windows -name "ModField-Agent-*-setup.exe" | head -1)
          test -n "$f" || { echo "installer not found under agent/installer/windows"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "$f" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  darwin:
    needs: build
    runs-on: macos-latest
    # As above: the signing condition reads an env, not the secrets context.
    env:
      HAS_APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile && pnpm build && sh scripts/embed-ui.sh
      # CGO on: the tray icon needs Cocoa. Build per-arch (the names the update
      # manifest and the Home list use), then a universal binary for a future .dmg.
      - run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o modfield-agent_darwin_$arch ./cmd/modfield-agent
          done
          lipo -create -output modfield-agent modfield-agent_darwin_arm64 modfield-agent_darwin_amd64
        working-directory: agent
      - name: Sign and notarize (Developer ID)
        if: ${{ env.HAS_APPLE_ID == 'true' }}
        run: echo "codesign --options runtime, notarytool submit, staple, then build the .dmg"
      - name: Upload darwin binaries to the release
        run: gh release upload "$GITHUB_REF_NAME" agent/modfield-agent_darwin_amd64 agent/modfield-agent_darwin_arm64 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gathers all six platform binaries, builds the Windows portable ZIPs, and
  # produces the two manifests the site and the agent read:
  #   manifest.json  — the Home download list (version, sizes, SHA-256)
  #   update.json    — the ed25519-signed auto-update manifest (internal/update)
  # then uploads them, the darwin binaries and the ZIPs to the release goreleaser
  # drafted. The release stays a draft until it is published by hand.
  manifest:
    # Also after windows-installer, so the installers are on the release to list.
    needs: [build, darwin, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Gather the released binaries and installers
        run: |
          mkdir -p agent/dist
          gh release download "$GITHUB_REF_NAME" -D agent/dist --clobber \
            -p 'modfield-agent_linux_*' -p 'modfield-agent_windows_*' \
            -p 'modfield-agent_darwin_amd64' -p 'modfield-agent_darwin_arm64' \
            -p 'ModField-Agent-*-setup.exe'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Windows portable ZIPs
        run: sh scripts/windows-portable.sh agent/dist "${GITHUB_REF_NAME#v}"
      - name: Home download list (manifest.json)
        run: node scripts/gen-download-manifest.mjs agent/dist "${GITHUB_REF_NAME#v}"
      - name: Signed auto-update manifest (update.json)
        working-directory: agent
        run: go run ./cmd/gen-manifest -dist dist -version "${GITHUB_REF_NAME#v}"
        env:
          MODFIELD_UPDATE_KEY: ${{ secrets.MODFIELD_UPDATE_KEY }}
      # goreleaser only checksums the linux/windows binaries it built; rebuild
      # checksums.txt over every artifact (incl. the darwin binaries and the
      # installers) so install.sh can verify the macOS download, and re-sign it.
      - name: Complete, signed checksums over every artifact
        working-directory: agent/dist
        run: |
          sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          sha256sum modfield-agent_* ModField-Agent-* > checksums.txt
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m checksums.txt -x checksums.txt.minisig
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      - name: Upload manifests, darwin binaries, ZIPs and checksums to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            agent/dist/modfield-agent_darwin_amd64 \
            agent/dist/modfield-agent_darwin_arm64 \
            agent/dist/ModField-Agent-*-portable.zip \
            agent/dist/manifest.json \
            agent/dist/update.json \
            agent/dist/checksums.txt \
            agent/dist/checksums.txt.minisig \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
