name: Release agent

on:
  push:
    tags: ["agent-v*"]

# Releases are signed with minisign over checksums.txt (free) and carry the
# ed25519-signed auto-update manifest. OS code signing (Windows Authenticode,
# Apple Developer ID) is intentionally not done — it needs paid certificates —
# so those steps stay gated on secrets and are skipped; the binaries ship
# unsigned and are verified by SHA-256 + minisign (see docs/install-agent).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: sudo apt-get install -y minisign
      # minisign -s takes a file path, so materialise the secret key into one.
      - name: Write minisign key
        run: |
          printf '%s' "${{ secrets.MINISIGN_SECRET_KEY }}" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: agent
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODFIELD_UPDATE_KEYRING: ${{ secrets.MODFIELD_UPDATE_KEYRING }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      # Signed auto-update manifest. The binaries the agent downloads for updates
      # are the ones published at /downloads (scripts/dist-agent.sh assembles that
      # directory with the matching names). Generate update.json once all six
      # platform binaries are gathered there and sign with the update key:
      #   MODFIELD_UPDATE_KEY=${{ secrets.MODFIELD_UPDATE_KEY }} \
      #     go run ./cmd/gen-manifest -dist <downloads> -version ${GITHUB_REF_NAME#agent-v}
      # Wire this once the /downloads publish step exists (the darwin binary comes
      # from the macos job below, so collect the artifacts first).

  windows-installer:
    needs: build
    runs-on: windows-latest
    strategy:
      matrix: { arch: [x64, arm64] }
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile && pnpm build && sh scripts/embed-ui.sh
        shell: bash
      - run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME#agent-v}" -o modfield-agent.exe ./cmd/modfield-agent
        working-directory: agent
        shell: bash
        env: { GOARCH: "${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}" }
      - name: Sign executable (Authenticode)
        if: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
        run: echo "sign agent/modfield-agent.exe with the chosen provider"
      - run: iscc /DVersion=${{ github.ref_name }} /DArch=${{ matrix.arch }} /DBinary=..\..\modfield-agent.exe agent\installer\windows\modfield-agent.iss

  darwin:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile && pnpm build && sh scripts/embed-ui.sh
      # CGO on: the tray icon needs Cocoa.
      - run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#agent-v}" -o modfield-agent-$arch ./cmd/modfield-agent
          done
          lipo -create -output modfield-agent modfield-agent-arm64 modfield-agent-amd64
        working-directory: agent
      - name: Sign and notarize (Developer ID)
        if: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
        run: echo "codesign --options runtime, notarytool submit, staple, then build the .dmg"
