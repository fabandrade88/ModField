name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node and pnpm versions come from mise.toml.
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Protocol (CRC, framing, types), transport (RTU over the simulated line), theme contrast.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @modfield/web exec playwright install --with-deps chromium firefox
      # The e2e suite also starts the real Go agent (scripts/e2e-agent.mjs).
      - run: pnpm test:e2e
        env:
          CI: "true"

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: go vet ./...
        working-directory: agent
      # Integration: the agent against its own simulator, every function and exception code.
      - run: go test -race ./...
        working-directory: agent
      - name: Cross-compile every target
        working-directory: agent
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -tags notray -o /dev/null ./cmd/modfield-agent
          done
