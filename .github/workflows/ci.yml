name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node and pnpm versions come from mise.toml.
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Protocol (CRC, framing, types), transport (RTU over the simulated line), theme contrast.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @modfield/web exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
        env:
          CI: "true"
